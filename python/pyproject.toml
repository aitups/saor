[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saor-orchestrator"
version = "0.1.0"
description = "Orquestador Python del experimento de optimización no dirigida (referencia NumPy + IPC con saor-engine)."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["saor_orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
